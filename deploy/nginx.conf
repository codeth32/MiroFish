server {
    listen 0.0.0.0:10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # Basic auth is required for the web app AND every API endpoint.
    # Render terminates public TLS before forwarding to this container.
    auth_basic "MiroFish - Private Access";
    auth_basic_user_file /etc/nginx/.mirofish.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Required for Render health checks; does not return sensitive data.
    location = /health {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:5001/health;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
